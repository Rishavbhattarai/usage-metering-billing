name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: metering
          POSTGRES_PASSWORD: metering
          POSTGRES_DB: metering_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U metering -d metering_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://metering:metering@localhost:5432/metering_test
      REQUIRE_DB: "1"   # fail (don't skip) integration tests if Postgres is missing
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff (lint)
        run: ruff check .
      - name: Ruff (format)
        run: ruff format --check .
      - name: Mypy
        run: mypy
      - name: Pytest
        run: pytest -q

  compose-smoke:
    # Whole stack (this API, aggregator, jobq API/worker/reaper from GitHub, Postgres, Redis):
    # ingest -> aggregate -> close via jobq -> sync to fake Salesforce (with a forced failure
    # and jobq retry) -> reconcile -> DLQ round trip -> replay the event log twice.
    runs-on: ubuntu-latest
    needs: test
    env:
      CLOSE_CUTOFF_LAG_SECONDS: "3"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Start stack
        run: docker compose up -d --build --wait
      - name: End-to-end demo (5,000 events)
        run: |
          pip install httpx
          python loadtest/demo.py --events 5000 --fail-sync --dlq --replay
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v
